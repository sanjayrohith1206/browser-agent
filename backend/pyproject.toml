[project]
name = "browser-agent-backend"
version = "0.1.0"
description = "Backend for the Personal AI Browser Agent: task API, WebSocket streaming and a LangGraph agent loop."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "jsonschema>=4.26",
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langgraph>=1.2",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.6",
    "langchain-ollama>=1.1",
    "langchain-google-genai>=4.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "redis>=6.0",
    "cryptography>=45",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "ruff>=0.13",
    "mypy>=1.18",
    "fakeredis[lua]>=2.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
